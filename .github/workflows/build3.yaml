name: Check Matter Valid Build Targets

on:
  workflow_dispatch: # Permite iniciar la verificación manualmente con un botón

jobs:
  check-targets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          repository: 'project-chip/connectedhomeip'
          ref: 'v1.3-branch' # Tu rama de Matter 1.3
          submodules: 'recursive' # Required to load the build module structures

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            ninja-build \
            libglib2.0-dev \
            libdbus-1-dev \
            unzip \
            curl

      # =========================================================================
      # BYPASS DE CIPD COMPLETO: PREVENIMOS EL CRASH INTERACTIVO ANTES DEL TEST
      # =========================================================================
      - name: Inject Pre-built ZAP
        run: |
          URL_ZAP="https://github.com/project-chip/zap/releases/download/v2024.03.29/zap-linux-x64.zip"
          curl -L --retry 5 --retry-delay 5 --fail "$URL_ZAP" -o zap.zip
          sudo mkdir -p /usr/local/share/zap
          sudo unzip -q zap.zip -d /usr/local/share/zap
          sudo ln -s /usr/local/share/zap/zap-cli /usr/local/bin/zap-cli
          sudo chmod +x /usr/local/bin/zap-cli
          if [ -f "scripts/setup/zap.json" ]; then
              echo '{"packages": []}' > scripts/setup/zap.json
          fi
          echo "ZAP_DEVELOPMENT_PATH=/usr/local/share/zap" >> $GITHUB_ENV

      # =========================================================================
      # EJECUCIÓN DE DIAGNÓSTICO: INTERROGAMOS LOS NOMBRE VÁLIDOS DE LA V1.3
      # =========================================================================
      - name: List All Valid Matter Targets
        run: |
          # [EDUCATIVO] Activamos la shell primero para inyectar PW_PROJECT_ROOT
          source scripts/activate.sh
          
          echo "=== LISTA DE TARGETS EN FORMATO RESUMIDO ==="
          python3 scripts/build/build_examples.py targets --format summary
          
          echo "=== LISTA DE TARGETS EN FORMATO EXPANDIDO ==="
          python3 scripts/build/build_examples.py targets --format expanded
