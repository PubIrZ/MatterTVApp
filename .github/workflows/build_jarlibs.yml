name: Build Matter TVApp (only .jar's for .so libs)
# JDK 11 & NDK 23.2.8568313 (r23c)

on:
  workflow_dispatch: # Se ejecuta manualmente desde el botón web de GitHub Actions

jobs:
  test-paths:
    runs-on: ubuntu-latest

    steps:
      # =========================================================================
      # 1. TRAEMOS TU REPOSITORIO PROPIO (Contiene compilar_core.sh)
      # =========================================================================
      - name: Checkout Local Repository (PubIrZ/MatterTVApp)
        uses: actions/checkout@v4

      # =========================================================================
      # 2. CLONADO DE EMERGENCIA DEL SDK EN CARPETA SEPARADA
      # =========================================================================
      - name: Emergency Upstream SDK Checkout (Isolated Folder)
        run: |
          PATH_project="/project-chip/connectedhomeip.git"
          URL_github="https://github.com${PATH_project}"
          echo "INFRA TEST: Clonando el SDK de Matter de forma aislada..."
          
          # Clonamos superficialmente dentro de la subcarpeta 'matter-sdk'
          git clone --depth 1 --branch v1.3-branch "${URL_github}" matter-sdk

      # =========================================================================
      # 3. PRUEBA DE RUTAS EN CALIENTE (Fase de diagnóstico)
      # =========================================================================
      - name: Verify Script Copy and Executable Permissions
        run: |
          echo "=== PASO 1: Verificar el estado del disco antes de la copia ==="
          echo "Buscando compilar_core.sh en la raíz del runner:"
          ls -la compilar_core.sh || echo "ERROR: El script no está en la raíz de tu repositorio"
          
          echo "=== PASO 2: Mover el script dentro de la subcarpeta aislada ==="
          cp compilar_core.sh matter-sdk/
          
          echo "=== PASO 3: Entrar a la carpeta y otorgar permisos de ejecución ==="
          cd matter-sdk
          chmod +x compilar_core.sh
          
          echo "=== PASO 4: DIAGNÓSTICO FINAL DE CONTROL ==="
          echo "Comprobando la existencia del script dentro de 'matter-sdk/':"
          if [ -f "compilar_core.sh" ]; then
            echo "SUCCESS: ¡El archivo compilar_core.sh existe en la ruta correcta!"
            echo "Verificando los permisos del archivo:"
            ls -la compilar_core.sh
            echo "SUCCESS: ¡Prueba de concepto superada con éxito! El YAML definitivo es seguro."
          else
            echo "CRITICAL ERROR: El archivo desapareció durante el proceso."
            exit 1
          fi

