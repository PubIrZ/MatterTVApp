name: Build Matter TVApp (only .jar's for .so libs)
# JDK 11 & NDK 23.2.8568313 (r23c)

on:
  workflow_dispatch: # Permite iniciar la compilación manualmente con un botón desde la interfaz web

jobs:
  build-tv-libraries:
    runs-on: ubuntu-latest

    steps:
      # =========================================================================
      # 1. PERSISTENCIA INQUEBRANTABLE (Aguanta entre diferentes "Run Workflows")
      # =========================================================================
      - name: Restore Complete Workspace from Cache
        uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: |
            ${{ github.workspace }}/.environment
            ${{ github.workspace }}/out
            ${{ github.workspace }}/third_party
            ${{ github.workspace }}/examples
            ${{ github.workspace }}/.git
            ${{ github.workspace }}/build
            ${{ github.workspace }}/src
          key: ${{ runner.os }}-matter-global-core-v1
          restore-keys: |
            ${{ runner.os }}-matter-global-core-

      - name: Evaluate Working Tree and Skip Checkout
        id: eval-disk
        run: |
          if [ -d "${{ github.workspace }}/src" ] && [ "$(ls -A ${{ github.workspace }}/src 2>/dev/null)" ]; then
            echo "SKIP_SETUP=true" >> $GITHUB_ENV
            echo "INFRA: Código fuente detectado en el disco virtual. Saltando configuraciones e inyecciones iniciales pesadas."
          else
            echo "SKIP_SETUP=false" >> $GITHUB_ENV
            echo "INFRA: Disco vacío. Activando inicialización completa de entorno..."
          fi

      - name: Emergency Checkout
        if: env.SKIP_SETUP == 'false'
        run: |
          PATH_project="/project-chip/connectedhomeip.git"
          URL_github="https://github.com${PATH_project}"
          git clone --depth 1 --branch v1.3-branch "${URL_github}" .
          git submodule update --init --recursive --depth 1

      # =========================================================================
      # MATRIZ DE CONFIGURACIÓN DE JAVA DUAL: ADAPTADO PARA COMPILACIÓN KOTLIN
      # =========================================================================
      - name: Set up Java JDK 11 (Para el compilador interno de Gradle/Kotlin v1.3)
        if: env.SKIP_SETUP == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Java JDK 17 (Fija Java 17 por defecto para el host y sdkmanager)
        uses: actions/setup-java@v4 # [OBLIGATORIO SIN IF] Se ejecuta siempre (tarda 1s) para registrar los punteros de entorno del Host Runner
        with:
          distribution: 'zulu'
          java-version: '17'

      # =========================================================================
      # RETROCOMPATIBILIDAD NDK: INYECTAMOS EL SDK r25c ESTABLE DE RESPALDO
      # =========================================================================
      - name: Set up Android NDK r25c
        id: setup-ndk # [OBLIGATORIO SIN IF] Inyecta las variables dinámicas de entorno ANDROID_NDK_ROOT requeridas por GN y Ninja en cada inicio
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 'r25c'

      # =========================================================================
      # ENTORNO SEGURO: PYTHON 3.11 EVITA EL CRASH DE LOS TIPOS DE DATOS (TYPEVAR)
      # =========================================================================
      - name: Set up Python 3.11
        if: env.SKIP_SETUP == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        if: env.SKIP_SETUP == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            ninja-build \
            libglib2.0-dev \
            libdbus-1-dev \
            git \
            unzip \
            curl \
            file

      # =========================================================================
      # INSTALACIÓN DE LA PLATAFORMA ANDROID 26 (Requisito de compilador cruzado)
      # =========================================================================
      - name: Install Missing Android 26 Platform SDK
        if: env.SKIP_SETUP == 'false'
        run: |
          echo "=== DESCARGANDO COMPONENTES HISTÓRICOS DE ANDROID ==="
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-26"
          echo "SUCCESS: Archivo android.jar (API 26) inyectado correctamente."

      # =========================================================================
      # PARCHE MAESTRO NDK COMPILER LAYOUT MATCHING: TRUCO DE ENLACE SIMBÓLICO
      # =========================================================================
      - name: Patch NDK r25c Directory Structure for Matter 1.3
        if: env.SKIP_SETUP == 'false'
        run: |
          echo "=== HACKING NDK DIRECTORY TREE FOR LIBC++ ==="
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          TARGET_STL_DIR_32="$NDK_PATH/sources/cxx-stl/llvm-libc++/libs/armeabi-v7a"
          TARGET_STL_DIR_64="$NDK_PATH/sources/cxx-stl/llvm-libc++/libs/arm64-v8a"
          mkdir -p "$TARGET_STL_DIR_32"
          mkdir -p "$TARGET_STL_DIR_64"
          
          REAL_SO_32="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so"
          REAL_SO_64="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          
          ln -s "$REAL_SO_32" "$TARGET_STL_DIR_32/libc++_shared.so"
          ln -s "$REAL_SO_64" "$TARGET_STL_DIR_64/libc++_shared.so"
          echo "SUCCESS: Enlaces simbólicos de libc++_shared.so creados con total éxito."

      # =========================================================================
      # BYPASS DE CIPD COMPLETO: DESCARGA ABIERTA, TRUCO VARIABLE LEGIBLE Y DESPLIEGUE
      # =========================================================================
      - name: Inject Pre-built ZAP and Bypass Interactive Prompts
        if: env.SKIP_SETUP == 'false'
        run: |
          ZAP_ASSET="/project-chip/zap/releases/download/v2024.03.29/zap-linux-x64.zip"
          URL_ZAP="https://github.com${ZAP_ASSET}"
          echo "INFRA: Descargando de forma inequívoca desde la ruta: ${URL_ZAP}"
          
          curl -L --retry 5 --retry-delay 5 --fail "$URL_ZAP" -o zap.zip
          sudo mkdir -p /usr/local/share/zap
          sudo unzip -o -q zap.zip -d /usr/local/share/zap

          if [ -d "/usr/local/share/zap/zap-linux-x64" ]; then
              echo "INFRA: Re-alineando árbol de directorios de Node.js..."
              sudo cp -r /usr/local/share/zap/zap-linux-x64/* /usr/local/share/zap/
              sudo rm -rf /usr/local/share/zap/zap-linux-x64
          fi
          
          sudo ln -sf /usr/local/share/zap/zap-cli /usr/local/bin/zap-cli
          sudo ln -sf /usr/local/share/zap/zap-cli /usr/local/bin/zap
          sudo chmod +x /usr/local/share/zap/zap-cli
          sudo chmod +x /usr/local/bin/zap-cli
          sudo chmod +x /usr/local/bin/zap
          
          if [ -f "scripts/setup/zap.json" ]; then
              echo '{"packages": []}' > scripts/setup/zap.json
              echo "INFRA: Archivo scripts/setup/zap.json neutralizado con éxito."
          fi
          
          echo "ZAP_INSTALL_PATH=/usr/local/bin" >> $GITHUB_ENV
      # =========================================================================
      # COMPILACIÓN LIMPIA DESDE CERO EN CASO DE FALLO (Solo out es purgado)
      # =========================================================================
      - name: Compile Core Java JAR Classes via Target Ninja
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ZAP_INSTALL_PATH: /usr/local/bin
        run: |
          # [ESTRATEGIA REPETICIÓN LIMPIA DE COMPILADOR]
          # Forzamos la eliminación únicamente de la carpeta 'out' para obligar a GN y Ninja
          # a reconstruir todo el árbol binario limpio desde cero, evitando arrastrar errores.
          # Mantener '.environment' intacto nos ahorra minutos críticos de descargas de herramientas Python.
          echo "INFRA: Purgando directorio out para iniciar compilación limpia..."
          rm -rf out
    
          echo "INFRA: activate.sh (Master environment initialization script): Initializes Pigweed"
          # 1. Inicializamos el entorno virtual de Pigweed
          source scripts/activate.sh

          # 2. Descarga física de JARs de soporte (Google Maven)
          echo "INFRA: Descargando pre-requisitos de dependencias de Android..."
          python3 third_party/android_deps/set_up_android_deps.py
          third_party/java_deps/set_up_java_deps.sh

          # =========================================================================
          # ¡EL CAMBIO MAESTRO! BORRAMOS -Werror DEL ARCHIVO FUENTE BUILD.gn
          # =========================================================================
          echo "INFRA: Aplicando parche de raíz sobre las plantillas de configuración GN..."
          find . -name "BUILD.gn" -exec sed -i 's|"-Werror",||g' {} +
          find . -name "BUILD.gn" -exec sed -i 's|"-Werror"||g' {} +
          
          find . -name "BUILD.gn" -exec sed -i 's|"-Xlint:all",||g' {} +
          find . -name "BUILD.gn" -exec sed -i 's|"-Xlint:all"||g' {} +
          
          find . -name "BUILD.gn" -exec sed -i 's|"-Xlint:deprecation",||g' {} +
          find . -name "BUILD.gn" -exec sed -i 's|"-Xlint:deprecation"||g' {} +

          # 3. Generamos el árbol físico de dependencias GN totalmente virgen
          echo "INFRA: Generando árbol físico de dependencias en disco..."
          gn gen out/android-arm-tv-server \
            --args='target_os="android" target_cpu="arm" android_ndk_root="'$ANDROID_NDK_ROOT'" android_sdk_root="/usr/local/lib/android/sdk" chip_config_network_layer_ble=false treat_warnings_as_errors=false' \
            --root=examples/tv-app/android/

          # Parche secundario de seguridad sobre el script ejecutable de Python
          find . -name "kotlinc_runner.py" -exec sed -i "s|'-Werror'||g" {} +
          find out/ -name "*.json" -exec sed -i 's|"-Werror",||g' {} +

          # =========================================================================
          # 4. INVOCACIÓN MAESTRA A NINJA (Compilación pura desde cero)
          # =========================================================================
          echo "INFRA: Compilando paquetes de clases Java..."
          ninja -C out/android-arm-tv-server

      # =========================================================================
      # [EL SALVAGUARDAS] GUARDA LA CACHÉ OBLIGATORIAMENTE AUNQUE EL BUILD FALLE
      # =========================================================================
      - name: Force Cache Save On Interrupted Runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/.environment
            ${{ github.workspace }}/out
            ${{ github.workspace }}/third_party
            ${{ github.workspace }}/examples
            ${{ github.workspace }}/.git
            ${{ github.workspace }}/build
            ${{ github.workspace }}/src
          key: ${{ runner.os }}-matter-global-core-v1

      # =========================================================================
      # EXTRACCIÓN Y SUBIDA AUTOMÁTICA DE LOS ARCHIVOS JAR DE CLASES
      # =========================================================================
      - name: Upload Core SDK JAR Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matter-core-java-jars
          path: |
            out/android-arm-tv-server/lib/*.jar
            out/android-arm-tv-server/gen/third_party/**/*.jar


