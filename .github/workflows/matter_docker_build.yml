name: Build Matter TVApp (Docker Multi-Job Way)
# La arquitectura estándar para congelar descargas y liberar el Re-run dinámico

on:
  workflow_dispatch: # Permite iniciar la compilación manualmente desde la interfaz web

jobs:
  # =========================================================================
  # JOB 1: DESCARGA ULTRA-PESADA DE SUBMÓDULOS (Ocurre una sola vez)
  # =========================================================================
  prepare-source-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Cache Source Check
        uses: actions/cache@v4
        id: source-cache
        with:
          path: matter-sdk
          key: matter-source-base-v1

      - name: Emergency Upstream SDK Checkout
        if: steps.source-cache.outputs.cache-hit != 'true'
        run: |
          PATH_project="/project-chip/connectedhomeip.git"
          URL_github="https://github.com${PATH_project}"
          echo "INFRA: Descargando el árbol completo de Matter por primera vez..."
          git clone --depth 1 --branch v1.3-branch "${URL_github}" matter-sdk
          cd matter-sdk
          git submodule update --init --recursive --depth 1

  # =========================================================================
  # JOB 2: COMPILACIÓN DINÁMICA (Si falla, el Re-run solo repite ESTE bloque)
  # =========================================================================
  compile-core-jars:
    runs-on: ubuntu-latest
    needs: prepare-source-tree # Espera obligatoriamente a que el Job 1 termine en verde
    
    # Forzamos a este trabajo específico a vivir dentro del contenedor oficial
    container:
      image: ghcr.io/project-chip/chip-build-android:126

    steps:
      # 1. Trae tu repositorio propio de GitHub con tu script compilar_core.sh actualizado
      - name: Checkout Local Repository (PubIrZ/MatterTVApp)
        uses: actions/checkout@v4

      # 2. Descarga el código base de Matter generado por el Job 1 en 3 segundos
      - name: Restore Source Tree from Job 1
        uses: actions/cache@v4
        with:
          path: matter-sdk
          key: matter-source-base-v1

      # 3. Inyección y ejecución de tu script dinámico de parches dentro de Docker
      - name: Run Clean Generation and Compile Core JARs
        shell: bash # Obligatorio para activar 'source scripts/activate.sh' dentro del contenedor
        run: |
          # Evitamos las restricciones de seguridad de Git del contenedor de raíz
          git config --global --add safe.directory /__w/MatterTVApp/MatterTVApp/matter-sdk
          
          echo "INFRA: Moviendo tu script de control compilar_core.sh dentro del SDK..."
          cp compilar_core.sh matter-sdk/
          cd matter-sdk
          chmod +x compilar_core.sh
          
          echo "INFRA: Delegando el control total a tu script dinámico..."
          ./compilar_core.sh

      # 4. Extracción automática de tus librerías .jar listas para Windows
      - name: Upload Core SDK JAR Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matter-core-java-jars-docker
          path: |
            matter-sdk/out/android-arm-tv-server/lib/*.jar
            matter-sdk/out/android-arm-tv-server/gen/third_party/**/*.jar
