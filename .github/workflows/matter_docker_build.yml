name: Build Matter TVApp (Docker Surgical Way)
# Entorno estándar sellado en contenedor oficial de Project CHIP sin cachés inestables

on:
  workflow_dispatch: # Permite iniciar la compilación manualmente con un botón desde la interfaz web

jobs:
  build-tv-docker:
    runs-on: ubuntu-latest
    
    # Todo se ejecuta dentro del búnker de Docker oficial de Matter
    container:
      image: ghcr.io/project-chip/chip-build-android:126

    steps:
      # =========================================================================
      # 1. CLONADO DIRECTO DENTRO DE DOCKER (Limpio y sin burocracia de caché)
      # =========================================================================
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          repository: 'project-chip/connectedhomeip'
          ref: 'v1.3-branch' # Tu rama estable compatible con Alexa y Android TV
          submodules: 'recursive' # Obligatorio para el núcleo de C++ de Matter

      # =========================================================================
      # 2. PARCHES DE INHIBICIÓN Y COMPILACIÓN QUIRÚRGICA
      # =========================================================================
      - name: Run Clean Generation and Compile Core JARs
        shell: bash # Forzamos el shell de Bash para que reconozca el comando 'source' internamente
        run: |
          # [SOLUCIÓN CRÍTICA DE PROPIEDAD] 
          # Engañamos a las restricciones de seguridad de Git registrando la ruta de Docker como segura
          echo "INFRA: Configurando excepciones de directorio seguro en Git..."
          git config --global --add safe.directory /__w/MatterTVApp/MatterTVApp

          # 1. Activamos las herramientas de Pigweed pre-instaladas en el contenedor
          source scripts/activate.sh

          # 2. Descargamos las dependencias base lógicas de Google Maven
          python3 third_party/android_deps/set_up_android_deps.py
          third_party/java_deps/set_up_java_deps.sh

          # =========================================================================
          # ¡EL CAMBIO MAESTRO DE RAÍZ! ELIMINAMOS -Werror Y DESACTIVAMOS ALERTAS
          # Modificamos los archivos fuentes antes de que GN lea las plantillas (.gn y .gni)
          # =========================================================================
          echo "INFRA: Removiendo flags estrictos de las plantillas fuentes BUILD.gn y .gni..."
          find . -name "BUILD.gn" -exec sed -i 's|"-Werror",||g' {} +
          find . -name "BUILD.gn" -exec sed -i 's|"-Werror"||g' {} +
          find . -name "*.gni" -exec sed -i 's|"-Werror",||g' {} +
          find . -name "*.gni" -exec sed -i 's|"-Werror"||g' {} +
          
          find . -name "BUILD.gn" -exec sed -i 's|"-Xlint:all",||g' {} +
          find . -name "BUILD.gn" -exec sed -i 's|"-Xlint:all"||g' {} +
          find . -name "*.gni" -exec sed -i 's|"-Xlint:all",||g' {} +
          find . -name "*.gni" -exec sed -i 's|"-Xlint:all"||g' {} +

          # 3. Forzamos la desactivación de alertas estéticas en el compilador de Kotlin (Kotlinc)
          # Inyectamos '-nowarn' al final del arreglo de Python de forma segura sin alterar la cabecera ejecutable
          export KOTLIN_COMPILER_ARGS="-nowarn -warn:0"
          export KOTLINC_ARGS="-nowarn"
          find . -name "kotlinc_runner.py" -exec sed -i "s|retcode = subprocess.check_call(kotlin_args + args.rest)|kotlin_args.append('-nowarn')\n    retcode = subprocess.check_call(kotlin_args + args.rest)|g" {} +
          find . -name "kotlinc_runner.py" -exec sed -i "s|'-Werror'||g" {} +

          # 4. Generamos el árbol limpio directo en el búnker
          gn gen out/android-arm-tv-server \
            --args='target_os="android" target_cpu="arm" chip_config_network_layer_ble=false treat_warnings_as_errors=false' \
            --root=examples/tv-app/android/

          # Parche secundario de seguridad sobre metadatos JSON
          find out/ -name "*.json" -exec sed -i 's|"-Werror",||g' {} +

          # 5. Invocamos al motor de Ninja para compilar tus clases lógicas de TV
          ninja -C out/android-arm-tv-server

      # =========================================================================
      # 3. EXTRACCIÓN AUTOMÁTICA DE LOS RECURSOS GENERADOS EN EL CONTENEDOR
      # =========================================================================
      - name: Upload Core SDK JAR Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matter-core-java-jars-docker
          path: |
            out/android-arm-tv-server/lib/*.jar
            out/android-arm-tv-server/gen/third_party/**/*.jar
