name: Build Matter TVApp

on:
  workflow_dispatch: # Permite iniciar la compilación manualmente con un botón desde la interfaz web

jobs:
  build-tv-libraries:
    runs-on: ubuntu-latest

    steps:
   
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          repository: 'project-chip/connectedhomeip'
          ref: 'v1.3-branch' # Tu rama estable recomendada de Matter
          submodules: 'recursive' # Obligatorio para descargar el núcleo de C++ de Matter

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 'r25c' # Versión de toolchain recomendada para el empaquetado de tv-app v1.3

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            ninja-build \
            python3-pip \
            python3-venv \
            python3-setuptools \
            git \
            unzip \
            curl \
            file


      - name: Inject Pre-built ZAP Compiler Tool
        run: |
          # 1. Usamos una URL de Release Oficial Global de ZAP que SÍ es 100% pública y libre de logins
          URL_ZAP="https://github.com/project-chip/zap/releases/download/v2024.03.29/zap-linux-x64.zip"
          
          echo "INFRA: Iniciando descarga verificada desde almacén público..."
          curl -L --retry 5 --retry-delay 5 --fail "$URL_ZAP" -o zap-linux-x64.zip
          
      # =========================================================================
      # PARCHE MAESTRO: DESTRUIMOS EL MENÚ INTERACTIVO MODIFICANDO EL CONFIG DE MATTER
      # =========================================================================
      - name: Inject Pre-built ZAP and Bypass Interactive Prompts
        run: |
          # 1. Descargamos el motor estable de ZAP de 64 bits (espejo público de GitHub)
          URL_ZAP="https://github.com/project-chip/zap/releases/download/v2024.03.29/zap-linux-x64.zip"
          echo "INFRA: Descargando compilador ZAP público..."
          curl -L --retry 5 --retry-delay 5 --fail "$URL_ZAP" -o zap.zip
          
          # 2. Creamos la carpeta global de herramientas en la máquina virtual
          sudo mkdir -p /usr/local/share/zap
          sudo unzip -q zap.zip -d /usr/local/share/zap
          
          # 3. Creamos los enlaces simbólicos para la terminal de Linux
          sudo ln -s /usr/local/share/zap/zap-cli /usr/local/bin/zap-cli
          sudo chmod +x /usr/local/bin/zap-cli
          
          # 4. TRUCO DE INFRAESTRUCTURA MÁXIMA: Modificamos el JSON interno de Matter.
          # Editamos 'scripts/setup/zap.json' para eliminar las dependencias de red de fuchsia/third_party/zap.
          # Al dejar el JSON limpio y sin paquetes remotos, 'activate.sh' no tendrá nada que descargar de Google Cloud
          # y jamás abrirá el menú interactivo que congela el servidor.
          if [ -f "scripts/setup/zap.json" ]; then
              echo '{"packages": []}' > scripts/setup/zap.json
              echo "INFRA: Archivo scripts/setup/zap.json neutralizado con éxito."
          fi
          
          # 5. Forzamos la variable global nativa para que use nuestra inyección local
          echo "ZAP_DEVELOPMENT_PATH=/usr/local/share/zap" >> $GITHUB_ENV
          echo "INFRA: Entorno ZAP blindado contra bloqueos interactivos."

      - name: Compile TV App (ARM 32-bit / armeabi-v7a)
        run: |
          # Al ejecutar activate.sh leerá el JSON vacío, saltará CIPD e irá directo a compilar
          source scripts/activate.sh
          ./scripts/build/build_examples.py --target android-arm-tv-app build

      - name: Compile TV App (ARM 64-bit / arm64-v8a)
        run: |
          source scripts/activate.sh
          ./scripts/build/build_examples.py --target android-arm64-tv-app build

      - name: Upload Compiled libTvApp.so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matter-tv-app-so-libraries
          path: |
            out/android-arm-tv-app/**/*.so
            out/android-arm64-tv-app/**/*.so
