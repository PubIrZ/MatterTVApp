name: Build Matter TVApp

on:
  workflow_dispatch: # Permite iniciar la compilación manualmente con un botón

jobs:
  build-tv-libraries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          repository: 'project-chip/connectedhomeip'
          ref: 'v1.3-branch' # Tu rama estable recomendada de Matter
          submodules: 'recursive'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 'r25c'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            ninja-build \
            python3-pip \
            python3-venv \
            python3-setuptools \
            git \
            unzip \
            curl

      # =========================================================================
      # BYPASS DE CIPD COMPLETO: DESCARGA E INYECCIÓN GLOBAL DEL COMPILADOR ZAP
      # =========================================================================
      - name: Inject Pre-built ZAP Compiler Tool
        run: |
          # 1. Descargamos el motor estable de ZAP desde el espejo público de lanzamientos de GitHub
          curl -L https://github.com -o zap.zip
          
          # 2. Creamos una carpeta de herramientas global compartida en el sistema de la máquina virtual Linux
          sudo mkdir -p /usr/local/share/zap
          sudo unzip zap.zip -d /usr/local/share/zap
          
          # 3. Creamos un enlace simbólico para que la terminal reconozca el comando de forma nativa en cualquier ruta
          sudo ln -s /usr/local/share/zap/zap-cli /usr/local/bin/zap-cli
          sudo chmod +x /usr/local/bin/zap-cli
          
          # 4. Inyectamos la variable nativa de Matter en el entorno global del pipeline.
          # Cuando 'activate.sh' lea esto, apagará por completo la llamada de red hacia el servidor CIPD bloqueado.
          echo "ZAP_DEVELOPMENT_PATH=/usr/local/share/zap" >> $GITHUB_ENV
          echo "INFRA: Variable ZAP_DEVELOPMENT_PATH inyectada de forma asertiva."

      - name: Compile TV App (ARM 32-bit / armeabi-v7a)
        run: |
          # Inicializa el entorno local de Matter (leerá ZAP_DEVELOPMENT_PATH y omitirá CIPD)
          source scripts/activate.sh
          # Ejecuta la compilación de la app y la librería libTvApp.so de 32 bits para Android TV común
          ./scripts/build/build_examples.py --target android-arm-tv-app build

      - name: Compile TV App (ARM 64-bit / arm64-v8a)
        run: |
          source scripts/activate.sh
          # Ejecuta la compilación de 64 bits de respaldo para Android TV de gama alta
          ./scripts/build/build_examples.py --target android-arm64-tv-app build

      - name: Upload Compiled libTvApp.so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matter-tv-app-so-libraries
          path: |
            out/android-arm-tv-app/**/*.so
            out/android-arm64-tv-app/**/*.so
