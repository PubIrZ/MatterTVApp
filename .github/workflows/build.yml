name: Build Matter TVApp

on:
  workflow_dispatch: # Permite iniciar la compilación manualmente con un botón desde la interfaz web

jobs:
  build-tv-libraries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          repository: 'project-chip/connectedhomeip'
          ref: 'v1.3-branch' # Tu rama estable recomendada de Matter
          submodules: 'recursive' # Obligatorio para descargar el núcleo de C++ de Matter

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 'r25c' # Versión de toolchain recomendada para el empaquetado de tv-app v1.3

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            ninja-build \
            python3-pip \
            python3-venv \
            python3-setuptools \
            git \
            unzip \
            curl \
            file

      # =========================================================================
      # BYPASS DE CIPD COMPLETO: DESCARGA ABIERTA, TEST DE INTEGRIDAD Y DESPLIEGUE
      # =========================================================================
      - name: Inject Pre-built ZAP Compiler Tool
        run: |
          # 1. Usamos una URL de Release Oficial Global de ZAP que SÍ es 100% pública y libre de logins
          URL_ZAP="https://github.com/project-chip/zap/releases/download/v2024.03.29"
          
          echo "INFRA: Iniciando descarga verificada desde almacén público..."
          curl -L --retry 5 --retry-delay 5 --fail "$URL_ZAP" -o zap-linux-x64.zip
          
          # 2. TEST DE INTEGRIDAD EN CALIENTE (Evita pasar páginas HTML como ZIPs falsos)
          echo "=== AUDITORÍA DE INTEGRIDAD ==="
          if unzip -t zap-linux-x64.zip > /dev/null 2>&1; then
              echo "SUCCESS: El archivo zap.zip se descargó de forma íntegra y es un archivo ZIP binario válido."
              echo "Tamaño real en disco:" && ls -lh zap-linux-x64.zip
          else
              echo "CRITICAL ERROR: El archivo descargado no es un ZIP válido (es un HTML de error o bloqueo de red)." >&2
              echo "Primeras líneas del archivo capturado por la red para diagnóstico:"
              head -n 10 zap-linux-x64.zip
              exit 1
          fi
          echo "================================="
          
          # 3. Despliegue global en el sistema de la máquina virtual Linux de la nube
          sudo mkdir -p /usr/local/share/zap
          sudo unzip -q zap-linux-x64.zip -d /usr/local/share/zap
          
          # 4. Enlace del binario ejecutable para que el PATH global de Linux lo reconozca
          sudo ln -s /usr/local/share/zap/zap-cli /usr/local/bin/zap-cli
          sudo chmod +x /usr/local/bin/zap-cli
          
          # 5. Inyección de la variable oculta del SDK para apagar CIPD definitivamente
          echo "ZAP_DEVELOPMENT_PATH=/usr/local/share/zap" >> $GITHUB_ENV
          echo "INFRA: Variable ZAP_DEVELOPMENT_PATH activada con éxito."

      - name: Compile TV App (ARM 32-bit / armeabi-v7a)
        run: |
          source scripts/activate.sh
          ./scripts/build/build_examples.py --target android-arm-tv-app build

      - name: Compile TV App (ARM 64-bit / arm64-v8a)
        run: |
          source scripts/activate.sh
          ./scripts/build/build_examples.py --target android-arm64-tv-app build

      - name: Upload Compiled libTvApp.so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matter-tv-app-so-libraries
          path: |
            out/android-arm-tv-app/**/*.so
            out/android-arm64-tv-app/**/*.so
