name: Build Matter TVApp (TVApp & .so libs)
# JDK 11 & NDK 23.2.8568313 (r23c)

on:
  workflow_dispatch: # Permite iniciar la compilación manualmente con un botón desde la interfaz web

jobs:
  build-tv-libraries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          repository: 'project-chip/connectedhomeip'
          ref: 'v1.3-branch' # Tu rama de mantenimiento estable v1.3 compatible con Alexa
          submodules: 'recursive' # Obligatorio para descargar el núcleo de C++ de Matter

      # =========================================================================
      # MATRIZ DE CONFIGURACIÓN INVERSA: EL ORDEN DETERMINA LA VERSION POR DEFECTO
      # =========================================================================
      - name: Set up Java JDK 11 (Para las herramientas internas de Matter v1.3)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Java JDK 17 (Para las herramientas del SDK de Google)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Al ser el último paso de Java, el sistema operativo queda fijado en Java 17 por defecto

      # =========================================================================
      # RETROCOMPATIBILIDAD NDK: INYECTAMOS LA VERSION EXACTA DE COMPILADOR CRUZADO
      # =========================================================================
      - name: Set up Android NDK r23c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 'r23c' # Identificador semántico oficial que resuelve el error 404

      # =========================================================================
      # ENTORNO SEGURO: PYTHON 3.11 EVITA EL CRASH DE LOS TIPOS DE DATOS (TYPEVAR)
      # =========================================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Fija el entorno nativo en la versión exacta que Matter 1.3 necesita

      # =========================================================================
      # SISTEMA DE PERSISTENCIA: CACHÉ ESTRUCTURAL PARA REAPROVECHAR COMPILACIONES
      # =========================================================================
      - name: Cache Matter Build Environment and Output Targets
        uses: actions/cache@v4
        with:
          path: |
            .environment
            out
          # La clave se amarra al hash del commit. Si el job falla, la clave se mantiene idéntica
          # obligando a la máquina virtual a restaurar los archivos del intento anterior.
          key: ${{ runner.os }}-matter-tvapp-cache-v2-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-matter-tvapp-cache-v2-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            ninja-build \
            libglib2.0-dev \
            libdbus-1-dev \
            git \
            unzip \
            curl \
            file

      # =========================================================================
      # INSTALACIÓN AISLADA DE LA PLATAFORMA ANDROID 26 (Inmune gracias a Java 17 nativo)
      # =========================================================================
      - name: Install Missing Android 26 Platform SDK
        run: |
          echo "=== DESCARGANDO COMPONENTES HISTÓRICOS DE ANDROID ==="
          # Como la máquina está corriendo nativamente en Java 17, el sdkmanager no experimenta bloqueos
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-26"
          echo "SUCCESS: Archivo android.jar (API 26) inyectado de forma segura y transparente."

      # =========================================================================
      # BYPASS DE CIPD COMPLETO: DESCARGA ABIERTA, TRUCO VARIABLE LEGIBLE Y DESPLIEGUE
      # =========================================================================
      - name: Inject Pre-built ZAP and Bypass Interactive Prompts
        run: |
          # [ESTRATEGIA BYPASS Editor Chat]
          # Conservamos tu concatenación de variables limpias e inequívocas para entroncar la arquitectura x64
          ZAP_ASSET="/project-chip/zap/releases/download/v2024.03.29/zap-linux-x64.zip"
          URL_ZAP="https://github.com${ZAP_ASSET}"
          echo "INFRA: Descargando de forma inequívoca desde la ruta: ${URL_ZAP}"
          
          curl -L --retry 5 --retry-delay 5 --fail "$URL_ZAP" -o zap.zip
          
          # 2. Creamos la carpeta global de herramientas y extraemos el ZIP
          sudo mkdir -p /usr/local/share/zap
          sudo unzip -o -q zap.zip -d /usr/local/share/zap

          # [NUEVO PARCHE CRÍTICO DE ENTORNO ZAP LAYOUT]
          if [ -d "/usr/local/share/zap/zap-linux-x64" ]; then
              echo "INFRA: Re-alineando árbol de directorios de Node.js..."
              sudo cp -r /usr/local/share/zap/zap-linux-x64/* /usr/local/share/zap/
              sudo rm -rf /usr/local/share/zap/zap-linux-x64
          fi
          
          # 3. Creamos los enlaces de ejecución simbólicos globales para Linux
          sudo ln -sf /usr/local/share/zap/zap-cli /usr/local/bin/zap-cli
          sudo ln -sf /usr/local/share/zap/zap-cli /usr/local/bin/zap
          sudo chmod +x /usr/local/share/zap/zap-cli
          sudo chmod +x /usr/local/bin/zap-cli
          sudo chmod +x /usr/local/bin/zap
          
          # 4. NEUTRALIZACIÓN DE CIPD: Vaciamos el archivo scripts/setup/zap.json.
          if [ -f "scripts/setup/zap.json" ]; then
              echo '{"packages": []}' > scripts/setup/zap.json
              echo "INFRA: Archivo scripts/setup/zap.json neutralizado con éxito."
          fi
          
          # 5. CORRECCIÓN CRÍTICA DE VARIABLE DE PRODUCCIÓN:
          echo "ZAP_INSTALL_PATH=/usr/local/bin" >> $GITHUB_ENV
          echo "INFRA: Entorno ZAP fijado con éxito en modo ejecución de producción."

      # =========================================================================
      # RE-ALINEACIÓN MAESTRA DE DOS PASOS ENMASCARADOS POR EL PROXY DE MATTER
      # =========================================================================
      - name: Compile TV App Shared Libraries (ARM 32-bit & 64-bit)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # [PARCHE MAESTRO ANTICORRUPCIÓN DE ENTORNO PIG_WEED]
          # Forzamos la eliminación física preventiva de las carpetas temporales desalineadas.
          # Esto obliga a scripts/activate.sh a mapear los punteros de bootstrap en limpio desde cero.
          echo "INFRA: Purgando variables de entorno desalineadas de la caché..."
          rm -rf .environment
          rm -rf out

          
          source scripts/activate.sh
          
          echo "INFRA: Aplicando parches sed quirúrgicos en android.py..."
          # PARCHE 1: Forzamos la inyección en caliente de Java 17 en la consola oculta de licencias de android.py.
          # Mapeamos el delimitador por tubería '|' para neutralizar las barras diagonales del path.
          if [ -n "$JAVA_HOME_17_X64" ]; then
              sed -i "s|yes \| %s --licenses|export JAVA_HOME=$JAVA_HOME_17_X64 \&\& export PATH=\$JAVA_HOME/bin:\$PATH \&\& yes \| %s --licenses|g" scripts/build/builders/android.py
          fi
          
          # PARCHE 2: Reemplazamos en caliente el comando de compilación global por una llamada explícita al target jni.
          # Le ordenamos compilar únicamente la librería nativa de C++ 'libTvApp.so', esquivando Kotlinc.
          sed -i 's|self._runner.Run(cmdarray|if "ninja" in cmdarray[0] or "ninja" in str(cmdarray): cmdarray.append("jni")\n        self._runner.Run(cmdarray|g' scripts/build/builders/android.py
              
          echo "INFRA: Ejecutando compilación cruzada limpia para ARM 32-bit (Forzando Java 11)..."
          JAVA_HOME=$JAVA_HOME_11_X64 ./scripts/build/build_examples.py --target android-arm-tv-server build
          
          echo "INFRA: Ejecutando compilación cruzada limpia para ARM 64-bit (Forzando Java 11)..."
          JAVA_HOME=$JAVA_HOME_11_X64 ./scripts/build/build_examples.py --target android-arm64-tv-server build

      # =========================================================================
      # PASO 2: EMPAQUETADO DEL APK MEDIANTE LLAMADA DIRECTA A GRAD_LEW
      # =========================================================================
      - name: Build Final Android TV Application APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "=== INICIANDO ENLACE DE CON_TEXTO GRADLE DE DOS PASOS ==="
          cd examples/tv-app/android
          chmod +x gradlew
          # Ejecutamos el empaquetador directo obligando a Gradle a correr aislado bajo Java 11
          ./gradlew -Dorg.gradle.java.home=$JAVA_HOME_11_X64 assembleDebug

      # =========================================================================
      # EXTRACCIÓN TRIPLE MANTENIDA: RECOGEMOS TANTO LAS .SO COMO EL APK EM_PAQUETADO
      # =========================================================================
      - name: Upload Compiled libTvApp.so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matter-tv-app-so-libraries
          path: |
            out/android-arm-tv-server/**/*.so
            out/android-arm64-tv-server/**/*.so

      - name: Upload Compiled Matter TVApp APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matter-tv-app-final-apks
          path: |
            examples/tv-app/android/app/build/outputs/apk/debug/*.apk
      

